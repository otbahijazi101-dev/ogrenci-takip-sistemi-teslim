name: Extract missing source files
on:
  push:
    branches: [main]
    paths:
      - missing-source.zip
      - .github/workflows/extract-missing.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source files
        run: |
          unzip -o missing-source.zip
          rm missing-source.zip
      - name: Commit extracted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/main.js src/styles.css supabase/schema.sql tests/rls.sql
          git rm --ignore-unmatch missing-source.zip
          git commit -m "Complete source import" || exit 0
          git push
